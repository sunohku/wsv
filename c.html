<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>圃場マップ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        html,
        body,
        #map {
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        async function loadMap() {
            try {
                // 地図作成
                const map = L.map('map').setView([36.74, 137.03], 10);

                // タイルレイヤー
                // タイルレイヤー（別の安定した無料タイルサーバーに変更）
                // タイルレイヤー（キー不要の標準OSM）
                // タイルレイヤー（CARTOのキー不要・無料プラン向けURL）
                // タイルレイヤー（国土地理院 地図・キー不要）
                L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
                    maxZoom: 18,
                    attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'
                }).addTo(map);

                // Edge FunctionからGeoJSON取得
                const res = await fetch('https://wkrwvgqicurgmcsitsum.supabase.co/functions/v1/get-farms');

                const geojson = await res.json();

                // GeoJSON描画
                L.geoJSON(geojson).addTo(map);
            } catch (e) {
                console.error('読み込みエラー:', e);
            }
        }

        loadMap();
    </script>
</body>

</html>
