<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>配達・銘柄管理マップ＆一覧表</title>
    
    <!-- LeafletのCSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; }
        #map { height: 100%; width: 100%; position: absolute; top: 0; left: 0; }
        
        /* 右上のコントロール（ステータス表示） */
        #controls {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 12px; border-radius: 6px;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.3); font-size: 13px;
        }

        /* 左下のメニューパネル */
        #menu-panel {
            position: absolute; bottom: 30px; left: 10px; z-index: 1000;
            display: flex; flex-direction: column; gap: 8px;
        }
        .menu-btn {
            background: #ffffff; color: #333; border: 2px solid rgba(0,0,0,0.2);
            padding: 10px 14px; border-radius: 8px; cursor: pointer;
            font-size: 13px; font-weight: bold; box-shadow: 0 3px 6px rgba(0,0,0,0.3);
            display: flex; align-items: center; gap: 6px; transition: background 0.2s;
        }
        .menu-btn:active { background: #f0f0f0; }

        /* 右下のロゴマーク */
        #map-logo {
            position: absolute; bottom: 35px; right: 10px; z-index: 1000;
            width: 110px; height: auto; border-radius: 6px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.8);
            background: white;
            pointer-events: none;
        }

        /* 【新規】一覧表画面のスタイル */
        #list-view-container {
            display: none; /* 初期状態は非表示 */
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #f5f5f5; z-index: 2000; box-sizing: border-box;
            padding: 15px; overflow-y: auto;
        }
        .list-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; background: white; padding: 10px 15px; border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .summary-box {
            display: flex; gap: 15px; background: #e8f5e9; padding: 10px 15px; border-radius: 8px;
            margin-bottom: 15px; font-size: 13px; border: 1px solid #c8e6c9; flex-wrap: wrap;
        }
        .summary-item { font-weight: bold; color: #2e7d32; }
        
        table.delivery-table {
            width: 100%; border-collapse: collapse; background: white; border-radius: 8px;
            overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); font-size: 12px;
        }
        table.delivery-table th, table.delivery-table td {
            padding: 8px 10px; border-bottom: 1px solid #eee; text-align: left;
        }
        table.delivery-table th {
            background: #2e7d32; color: white; font-weight: bold;
        }
        table.delivery-table tr:hover { background: #f9f9f9; }

        .input-group { margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; }
        .input-group label { font-weight: bold; width: 75px; text-align: left; }
        .input-group input, .input-group select { padding: 2px; width: 130px; }
        .rice-group { border-top: 1px dashed #ccc; margin-top: 6px; padding-top: 6px; }

        /* ピンのデザイン */
        .tawara-marker {
            background-color: #f4a460; border: 2px solid #8b4513; color: #fff;
            font-weight: bold; font-size: 12px; text-align: center; line-height: 28px;
            width: auto; min-width: 32px; height: 32px; padding: 0 4px; border-radius: 16px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.4); cursor: grab; white-space: nowrap;
        }
        .tawara-marker:active { cursor: grabbing; }
        .tawara-marker.completed { background-color: #1e88e5; border-color: #0d47a1; }
    </style>
</head>

<body>
    <!-- 右上：ステータス -->
    <div id="controls">
        <b>🌾 配達管理マップ</b><br>
        <span id="status" style="color: #666;">データを読み込んでいます...</span>
    </div>

    <!-- 左下：メニューパネル -->
    <div id="menu-panel">
        <button class="menu-btn" onclick="toggleDisplayMode()">
            🔄 表示切替: <span id="mode-label" style="color: #d32f2f;">番号</span>
        </button>
        <button class="menu-btn" onclick="toggleViewMode()">
            📊 <span id="view-mode-label">一覧表を表示</span>
        </button>
        <button class="menu-btn" onclick="moveToCurrentLocation()">
            📍 現在地へ移動
        </button>
    </div>

    <!-- 右下：ロゴ画像 -->
    <img id="map-logo" src="logo.png" alt="Takaoka Tanbojima Logo">

    <!-- 地図領域 -->
    <div id="map"></div>

    <!-- 【新規】一覧表画面領域 -->
    <div id="list-view-container">
        <div class="list-header">
            <h2 style="margin: 0; font-size: 18px; color: #2e7d32;">📊 配達数量・一覧表</h2>
            <button class="menu-btn" onclick="toggleViewMode()" style="padding: 6px 12px; background: #d32f2f; color: white;">✖ 閉じる（地図に戻る）</button>
        </div>
        
        <!-- 合計数量サマリー -->
        <div id="summary-container" class="summary-box">
            <!-- JavaScriptで自動計算して挿入 -->
        </div>

        <div style="overflow-x: auto;">
            <table class="delivery-table">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>名前</th>
                        <th>ステータス</th>
                        <th>コシ</th>
                        <th>富富富</th>
                        <th>てんた</th>
                        <th>アルギ</th>
                        <th>その他</th>
                        <th>電話・メモ</th>
                    </tr>
                </thead>
                <tbody id="list-table-body">
                    <!-- JavaScriptでデータ埋め込み -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Supabase公式JSライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- LeafletのJS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const supabaseUrl = "https://wkrwvgqicurgmcsitsum.supabase.co";
        const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indrcnd2Z3FpY3VyZ21jc2l0c3VtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMzAzODgsImV4cCI6MjEwNDYwNjM4OH0.ySyHm-7v0cf0LKu_jcSwMrXUAoC67rz5vOcpEilgLZE"; 

        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        var map = L.map('map', {
            zoomControl: true,
            tap: false
        }).setView([36.747, 137.016], 13);

        var gsiLayer = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', {
            attribution: "地理院タイル",
            maxZoom: 18,
            zIndex: 1
        }).addTo(map);

        var deliveryLayerGroup = L.layerGroup().addTo(map);

        let maxNo = 0;
        let locationsData = []; 
        let displayMode = 'no'; 
        let isListView = false;
        let currentMarker = null; 

        window.addEventListener('DOMContentLoaded', async () => {
            await loadDeliveryLocations();
        });

        // データの読み込み
        async function loadDeliveryLocations() {
            try {
                // Noの昇順で取得するように修正
                const { data: locations, error } = await supabaseClient
                    .from('delivery_locations')
                    .select('*')
                    .order('no', { ascending: true });

                if (error) throw error;

                locationsData = locations; 
                renderMarkers();
                renderListView();

            } catch (err) {
                console.error("データ読み込み失敗:", err);
                document.getElementById('status').innerHTML = `<span style="color: #c62828; font-weight: bold;">読み込みエラー</span>`;
            }
        }

        // 地図のマーカーを描画
        function renderMarkers() {
            deliveryLayerGroup.clearLayers();
            let count = 0;
            maxNo = 0;

            locationsData.forEach(loc => {
                if (loc.no && loc.no > maxNo) {
                    maxNo = loc.no;
                }

                if (loc.latitude && loc.longitude) {
                    let isCompleted = loc.status === '配達完了';
                    let markerClass = isCompleted ? 'tawara-marker completed' : 'tawara-marker';
                    
                    let displayText = displayMode === 'no' ? (loc.no ?? '-') : (loc.name ? loc.name.substring(0, 4) + '様' : '未入力');

                    let tawaraIcon = L.divIcon({
                        className: '', 
                        html: `<div class="${markerClass}">${displayText}</div>`,
                        iconSize: [null, 32],
                        iconAnchor: [16, 16]
                    });

                    let marker = L.marker([loc.latitude, loc.longitude], { icon: tawaraIcon, draggable: true });

                    let mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc.address || '')}`;
                    let phoneHtml = loc.phone ? `<a href="tel:${loc.phone}" style="color: #1976d2; font-weight: bold;">${loc.phone}</a>` : 'なし';
                    let statusColor = isCompleted ? '#1e88e5' : '#c62828';

                    let popupHtml = `
                        <div style="font-size: 13px; line-height: 1.5; min-width: 180px;">
                            <div><strong>No.</strong>：${loc.no ?? '-'} | <span style="color: ${statusColor}; font-weight: bold;">${loc.status ?? '未配達'}</span></div>
                            <div><strong>名前</strong>：${loc.name ?? '未入力'}様</div>
                            <div><strong>住所</strong>：<a href="${mapsUrl}" target="_blank" style="color: #1976d2; text-decoration: underline;">${loc.address ?? '-'}</a></div>
                            <div><strong>電話</strong>：${phoneHtml}</div>
                            <div class="rice-group">
                                <div>コシヒカリ: <strong>${loc.koshihikari ?? 0}</strong> 袋</div>
                                <div>富富富: <strong>${loc.fufufu ?? 0}</strong> 袋</div>
                                <div>てんたかく: <strong>${loc.tentakaku ?? 0}</strong> 袋</div>
                                <div>アルギット: <strong>${loc.argit ?? 0}</strong> 袋</div>
                                <div>その他: <strong>${loc.other_rice ?? 0}</strong> 袋</div>
                            </div>
                            ${loc.memo ? `<div><strong>メモ:</strong> ${loc.memo}</div>` : ''}
                            <div style="margin-top: 8px; display: flex; gap: 4px;">
                                <button onclick="toggleStatus(${loc.id}, '${loc.status}')" style="flex: 1.2; background: #ff9800; color: white; border: none; padding: 4px; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: bold;">配達</button>
                                <button onclick="openEditForm(${loc.id})" style="flex: 1; background: #2196f3; color: white; border: none; padding: 4px; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: bold;">編集</button>
                                <button onclick="deleteLocation(${loc.id}, '${loc.name}')" style="background: #d32f2f; color: white; border: none; padding: 4px 6px; border-radius: 3px; cursor: pointer; font-size: 11px;">削除</button>
                            </div>
                        </div>
                    `;
                    marker.bindPopup(popupHtml);

                    marker.on('dragend', async function(e) {
                        let newPos = e.target.getLatLng();
                        try {
                            await supabaseClient.from('delivery_locations').update({ latitude: newPos.lat, longitude: newPos.lng }).eq('id', loc.id);
                        } catch (err) {
                            alert('位置更新に失敗しました');
                            loadDeliveryLocations();
                        }
                    });

                    deliveryLayerGroup.addLayer(marker);
                    count++;
                }
            });

            document.getElementById('status').innerHTML = `<span style="color: #2e7d32; font-weight: bold;">${count}件表示中 (次No:${maxNo + 1})</span>`;
        }

        // 【新規】一覧表を描画する関数
        function renderListView() {
            let tbody = document.getElementById('list-table-body');
            tbody.innerHTML = '';

            let totalKoshi = 0, totalFufu = 0, totalTenta = 0, totalArgit = 0, totalOther = 0;

            locationsData.forEach(loc => {
                totalKoshi += loc.koshihikari || 0;
                totalFufu += loc.fufufu || 0;
                totalTenta += loc.tentakaku || 0;
                totalArgit += loc.argit || 0;
                totalOther += loc.other_rice || 0;

                let isCompleted = loc.status === '配達完了';
                let statusBadge = isCompleted 
                    ? `<span style="color:#1e88e5; font-weight:bold; cursor:pointer;" onclick="toggleStatus(${loc.id}, '配達完了')">✔完了</span>` 
                    : `<span style="color:#c62828; font-weight:bold; cursor:pointer;" onclick="toggleStatus(${loc.id}, '未配達')">⏳未配達</span>`;

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${loc.no ?? '-'}</b></td>
                    <td><b>${loc.name ?? '-'}様</b><br><span style="color:#666; font-size:10px;">${loc.address ?? ''}</span></td>
                    <td>${statusBadge}</td>
                    <td>${loc.koshihikari || 0}</td>
                    <td>${loc.fufufu || 0}</td>
                    <td>${loc.tentakaku || 0}</td>
                    <td>${loc.argit || 0}</td>
                    <td>${loc.other_rice || 0}</td>
                    <td>
                        ${loc.phone ? `<a href="tel:${loc.phone}">${loc.phone}</a><br>` : ''}
                        <span style="font-size:10px; color:#555;">${loc.memo || ''}</span>
                        <div style="margin-top:4px;">
                            <button onclick="openEditForm(${loc.id})" style="background:#2196f3; color:white; border:none; padding:2px 6px; border-radius:3px; font-size:10px; cursor:pointer;">編集</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // 合計サマリーの表示
            let summaryDiv = document.getElementById('summary-container');
            summaryDiv.innerHTML = `
                <div class="summary-item">🌾 コシヒカリ: ${totalKoshi}袋</div>
                <div class="summary-item">🌾 富富富: ${totalFufu}袋</div>
                <div class="summary-item">🌾 てんたかく: ${totalTenta}袋</div>
                <div class="summary-item">🌾 アルギット: ${totalArgit}袋</div>
                <div class="summary-item">🌾 その他: ${totalOther}袋</div>
                <div style="width:100%; font-weight:bold; color:#333; margin-top:2px;">総計袋数: ${totalKoshi + totalFufu + totalTenta + totalArgit + totalOther} 袋</div>
            `;
        }

        // 地図 ⇄ 一覧表の切り替え
        window.toggleViewMode = function() {
            isListView = !isListView;
            let container = document.getElementById('list-view-container');
            let label = document.getElementById('view-mode-label');

            if (isListView) {
                container.style.display = 'block';
                label.innerText = '地図に戻る';
                renderListView();
            } else {
                container.style.display = 'none';
                label.innerText = '一覧表を表示';
                map.invalidateSize(); // 地図の表示崩れ防止
            }
        };

        // 表示モード切替
        window.toggleDisplayMode = function() {
            displayMode = displayMode === 'no' ? 'name' : 'no';
            document.getElementById('mode-label').innerText = displayMode === 'no' ? '番号' : '名前';
            document.getElementById('mode-label').style.color = displayMode === 'no' ? '#d32f2f' : '#1976d2';
            renderMarkers();
        };

        // 現在地へ移動
        window.moveToCurrentLocation = function() {
            if (!navigator.geolocation) { alert('位置情報非対応です'); return; }
            if (isListView) toggleViewMode(); // 地図に戻す

            navigator.geolocation.getCurrentPosition((pos) => {
                let lat = pos.coords.latitude, lng = pos.coords.longitude;
                map.setView([lat, lng], 16);
                if (currentMarker) map.removeLayer(currentMarker);
                
                let currentIcon = L.divIcon({
                    className: '',
                    html: `<div style="background: #2196f3; width: 16px; height: 16px; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); transform: translate(-8px, -8px);"></div>`,
                    iconSize: [0, 0], iconAnchor: [0, 0]
                });
                currentMarker = L.marker([lat, lng], { icon: currentIcon }).addTo(map);
                currentMarker.bindPopup("<b>ここっ♪</b>").openPopup();
            }, () => alert('現在地を取得できませんでした'), { enableHighAccuracy: true });
        };

        // 地図クリック時（新規追加）
        map.on('click', function(e) {
            let lat = e.latlng.lat, lng = e.latlng.lng, nextNo = maxNo + 1;
            let formHtml = `
                <div style="font-size: 12px; line-height: 1.3; min-width: 200px;">
                    <b>新規追加（No. ${nextNo}）</b><br>
                    <div class="input-group" style="margin-top:4px;"><label>名前:</label><input type="text" id="newName" placeholder="お名前"></div>
                    <div class="input-group"><label>住所:</label><input type="text" id="newAddress" placeholder="住所"></div>
                    <div class="input-group"><label>電話:</label><input type="text" id="newPhone" placeholder="電話番号"></div>
                    <div class="rice-group">
                        <div class="input-group"><label>コシヒカリ:</label><input type="number" id="newKoshi" value="0" min="0"></div>
                        <div class="input-group"><label>富富富:</label><input type="number" id="newFufu" value="0" min="0"></div>
                        <div class="input-group"><label>てんたかく:</label><input type="number" id="newTenta" value="0" min="0"></div>
                        <div class="input-group"><label>アルギット:</label><input type="number" id="newArgit" value="0" min="0"></div>
                        <div class="input-group"><label>その他:</label><input type="number" id="newOther" value="0" min="0"></div>
                    </div>
                    <div class="input-group" style="margin-top:4px;"><label>メモ:</label><input type="text" id="newMemo" placeholder="備考など"></div>
                    <button onclick="saveNewLocation(${lat}, ${lng}, ${nextNo})" style="margin-top: 8px; width: 100%; background: #1976d2; color: white; border: none; padding: 6px; border-radius: 4px; cursor: pointer; font-weight: bold;">登録する</button>
                </div>
            `;
            L.popup().setLatLng([lat, lng]).setContent(formHtml).openOn(map);
        });

        window.saveNewLocation = async function(lat, lng, assignedNo) {
            let name = document.getElementById('newName').value;
            if (!name) { alert('名前を入力してください'); return; }
            try {
                const { error } = await supabaseClient.from('delivery_locations').insert([{ 
                    no: assignedNo, name: name, 
                    address: document.getElementById('newAddress').value, 
                    phone: document.getElementById('newPhone').value, 
                    koshihikari: parseInt(document.getElementById('newKoshi').value) || 0,
                    fufufu: parseInt(document.getElementById('newFufu').value) || 0,
                    tentakaku: parseInt(document.getElementById('newTenta').value) || 0,
                    argit: parseInt(document.getElementById('newArgit').value) || 0,
                    other_rice: parseInt(document.getElementById('newOther').value) || 0,
                    memo: document.getElementById('newMemo').value,
                    status: '未配達', latitude: lat, longitude: lng 
                }]);
                if (error) throw error;
                alert(`No.${assignedNo} ${name}様を登録しました！`);
                map.closePopup();
                loadDeliveryLocations();
            } catch (err) { alert('登録失敗: ' + err.message); }
        };

        // 編集フォーム
        window.openEditForm = async function(id) {
            try {
                const { data, error } = await supabaseClient.from('delivery_locations').select('*').eq('id', id).single();
                if (error) throw error;

                let editHtml = `
                    <div style="font-size: 12px; line-height: 1.3; min-width: 200px;">
                        <b>データ編集（No. ${data.no ?? '-'}）</b><br>
                        <div class="input-group" style="margin-top:4px;"><label>名前:</label><input type="text" id="editName" value="${data.name ?? ''}"></div>
                        <div class="input-group"><label>住所:</label><input type="text" id="editAddress" value="${data.address ?? ''}"></div>
                        <div class="input-group"><label>電話:</label><input type="text" id="editPhone" value="${data.phone ?? ''}"></div>
                        <div class="rice-group">
                            <div class="input-group"><label>コシヒカリ:</label><input type="number" id="editKoshi" value="${data.koshihikari ?? 0}" min="0"></div>
                            <div class="input-group"><label>富富富:</label><input type="number" id="editFufu" value="${data.fufufu ?? 0}" min="0"></div>
                            <div class="input-group"><label>てんたかく:</label><input type="number" id="editTenta" value="${data.tentakaku ?? 0}" min="0"></div>
                            <div class="input-group"><label>アルギット:</label><input type="number" id="editArgit" value="${data.argit ?? 0}" min="0"></div>
                            <div class="input-group"><label>その他:</label><input type="number" id="editOther" value="${data.other_rice ?? 0}" min="0"></div>
                        </div>
                        <div class="input-group" style="margin-top:4px;"><label>メモ:</label><input type="text" id="editMemo" value="${data.memo ?? ''}"></div>
                        <button onclick="saveEditLocation(${data.id})" style="margin-top: 8px; width: 100%; background: #2196f3; color: white; border: none; padding: 6px; border-radius: 4px; cursor: pointer; font-weight: bold;">更新する</button>
                    </div>
                `;
                if (isListView) {
                    // リストからの編集時は一時的にポップアップ用のマーカー位置へジャンプまたは簡易処理
                    let marker = L.marker([data.latitude, data.longitude]).addTo(map).bindPopup(editHtml).openPopup();
                    toggleViewMode(); // 地図に戻す
                } else {
                    let marker = map._popup;
                    if (marker) marker.setContent(editHtml);
                }
            } catch (err) { alert('編集データ取得失敗'); }
        };

        window.saveEditLocation = async function(id) {
            let name = document.getElementById('editName').value;
            if (!name) { alert('名前を入力してください'); return; }
            try {
                const { error } = await supabaseClient.from('delivery_locations').update({ 
                    name: name, 
                    address: document.getElementById('editAddress').value, 
                    phone: document.getElementById('editPhone').value, 
                    koshihikari: parseInt(document.getElementById('editKoshi').value) || 0,
                    fufufu: parseInt(document.getElementById('editFufu').value) || 0,
                    tentakaku: parseInt(document.getElementById('editTenta').value) || 0,
                    argit: parseInt(document.getElementById('editArgit').value) || 0,
                    other_rice: parseInt(document.getElementById('editOther').value) || 0,
                    memo: document.getElementById('editMemo').value
                }).eq('id', id);
                if (error) throw error;
                alert('データを更新しました！');
                map.closePopup();
                loadDeliveryLocations();
            } catch (err) { alert('更新失敗: ' + err.message); }
        };

        // ステータス切替
        window.toggleStatus = async function(id, currentStatus) {
            let nextStatus = currentStatus === '配達完了' ? '未配達' : '配達完了';
            try {
                const { error } = await supabaseClient.from('delivery_locations').update({ status: nextStatus }).eq('id', id);
                if (error) throw error;
                map.closePopup();
                loadDeliveryLocations();
            } catch (err) { alert('ステータス更新失敗'); }
        };

        // 削除
        window.deleteLocation = async function(id, name) {
            if (!confirm(`${name}様のデータを削除しますか？`)) return;
            try {
                const { error } = await supabaseClient.from('delivery_locations').delete().eq('id', id);
                if (error) throw error;
                alert('データを削除しました');
                map.closePopup();
                loadDeliveryLocations();
            } catch (err) { alert('削除失敗'); }
        };
    </script>
</body>

</html>
