<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム追跡 地理院地図 (シンプル版)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- QRコード生成用のライブラリを読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Firebaseの読み込み（Compat版） -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- ★firebaseの初期化 -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCCMQ-1VdU-De9veqkh1UEnaWQq71dgG-U",
            authDomain: "my-map-log-5e3bd.firebaseapp.com",
            projectId: "my-map-log-5e3bd",
            storageBucket: "my-map-log-5e3bd.firebasestorage.app",
            messagingSenderId: "52246773478",
            appId: "1:52246773478:web:dc5eb04d5e52d49422c527"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>

    <style>
        html,
        body,
        #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* ==========================================
        // 【デザイン設定：進行方向を向く矢印マーカー】
        // スマホの向き（進行方向）に合わせて回転する三角形のマーカーデザインです。
        // ========================================== */
        .arrow-marker {
            background: transparent;
            border: none;
        }
        .arrow-icon-inner {
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 24px solid #1976d2; /* 矢印の色（青） */
            transform-origin: 50% 70%;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));
        }

        /* ==========================================
        // 【デザイン設定：操作パネル全体】
        // 画面の左下にある、ボタンやラベル設定を選ぶ操作パネルの枠組みや位置を整えています。
        // ========================================== */
        #controls {
            position: absolute;
            bottom: 20px;
            left: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px;
            border-radius: 6px;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);
            font-size: 13px;
        }

        /* ==========================================
        // 【デザイン設定：操作パネルの行（横並び）】
        // パネル内の項目を横一列にきれいに並べるための設定です。
        // ========================================== */
        .control-row {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            align-items: flex-end;
        }

        /* ==========================================
        // 【デザイン設定：入力項目グループ（縦並び）】
        // 文字ラベルと入力欄をセットにして縦に並べる設定です。
        // ========================================== */
        .control-group {
            display: flex;
            flex-direction: column;
            font-size: 12px;
            font-weight: bold;
        }

        .control-group input,
        .control-group select {
            padding: 4px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* 現在地ファイル保存ボタンのデザイン */
        .btn-current-loc {
            padding: 5px 10px;
            font-size: 13px;
            font-weight: bold;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            height: 29px;
        }

        .btn-current-loc:hover {
            background-color: #1b5e20;
        }

        /* 画面右上にQRコードを表示するボックス */
        #qr-box {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 10px;
            border-radius: 6px;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);
            text-align: center;
            font-size: 11px;
            font-weight: bold;
        }

        #qrcode {
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <!-- 画面右上にスマホアクセス用のQRコードを表示 -->
    <div id="qr-box">
        <span>スマホでアクセス</span>
        <div id="qrcode"></div>
    </div>

    <div id="controls">
        <div>
            <button onclick="startTracking()">追跡開始</button>
            <button onclick="stopTracking()">追跡終了</button>
            <label style="margin-left: 8px;"><input type="checkbox" id="labelToggle" checked
                    onchange="toggleLabels(this)"> ラベル表示</label>
            <select id="labelFieldSelect" onchange="updateLabels()"
                style="margin-left: 4px; padding: 2px; font-size: 12px;">
                <option value="">(項目を選択)</option>
            </select>
        </div>

        <div class="control-row">
            <div class="control-group">
                <span>日付</span>
                <input type="date" id="global-date">
            </div>
            <div class="control-group">
                <span>時間</span>
                <input type="time" id="global-time">
            </div>
            <!-- 「現在地」ボタン -->
            <button class="btn-current-loc" onclick="saveCurrentLocationCsv()">現在地</button>
        </div>

        <input type="file" id="fileInput" accept=".geojson,.json" style="display:none;" />
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // ==========================================
        // 【初期化処理】ページ読み込み完了時に自動実行されます
        // ==========================================
        window.addEventListener('DOMContentLoaded', async () => {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            document.getElementById('global-date').value = `${year}-${month}-${day}`;
            document.getElementById('global-time').value = `${hours}:${minutes}`;

            // 画面右上に、現在開いているページのURLのQRコードを自動生成する
            new QRCode(document.getElementById("qrcode"), {
                text: window.location.href,
                width: 100,
                height: 100,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            await loadGeoJsonFromServer();

            setTimeout(() => {
                map.invalidateSize();
            }, 100);
        });

        // 地図の初期化（地理院タイル：航空写真）
        var map = L.map('map').setView([36.747, 137.016], 14);

        var gsiLayer = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', {
            attribution: "地理院タイル（航空写真）",
            maxZoom: 18,
            zIndex: 1
        }).addTo(map);

        var currentMarker = null;
        var watchId = null;
        var geojsonLayer = null;
        var currentGeojsonObj = null;
        var labelLayerGroup = L.layerGroup();

        // ==========================================
        // 【GeoJSON読み込み】サーバーからポリゴンデータ(geojson)を取得する処理
        // ==========================================
        async function loadGeoJsonFromServer() {
            try {
                let response = await fetch('品目5_4326.geojson');
                if (!response.ok) throw new Error("サーバーからファイルを取得できませんでした。");
                currentGeojsonObj = await response.json();

                populateLabelFields(currentGeojsonObj);
                renderGeoJson(currentGeojsonObj);
            } catch (err) {
                console.log("自動読み込み失敗:", err);
            }
        }

        // ==========================================
        // 【ラベル項目設定】地図上に表示する項目の選択肢を組み立てる処理
        // ==========================================
        function populateLabelFields(geojson) {
            const select = document.getElementById('labelFieldSelect');
            select.innerHTML = "";

            let keysSet = new Set();
            if (geojson && geojson.features) {
                geojson.features.forEach(f => {
                    if (f.properties) {
                        Object.keys(f.properties).forEach(k => keysSet.add(k));
                    }
                });
            }

            keysSet.forEach(key => {
                let opt = document.createElement('option');
                opt.value = key;
                opt.innerText = key;
                select.appendChild(opt);
            });

            if (keysSet.has("東西列No")) {
                select.value = "東西列No";
            } else if (keysSet.has("name")) {
                select.value = "name";
            } else if (keysSet.has("hinmoku")) {
                select.value = "hinmoku";
            }
        }

        // ==========================================
        // 【GeoJSON描画】取得したポリゴンデータを地図上に色分けして表示する処理
        // ==========================================
        function renderGeoJson(geojson) {
            if (geojsonLayer) map.removeLayer(geojsonLayer);

            geojsonLayer = L.geoJSON(geojson, {
                style: function (feature) {
                    let p = feature.properties || {};
                    let hinmoku = p.hinmoku || p.品種名 || p.品目 || p.CD || "";
                    let baseColor = getColorByHinmoku(hinmoku);
                    return {
                        color: baseColor,
                        fillColor: baseColor,
                        fillOpacity: 0.6,
                        weight: 1.5
                    };
                }
            });

            geojsonLayer.addTo(map);
            gsiLayer.bringToBack();
            updateLabels();

            const bounds = geojsonLayer.getBounds();
            if (bounds.isValid()) {
                map.fitBounds(bounds);
            }
            map.invalidateSize();
        }

        // ==========================================
        // 【色判定】品種名に応じてポリゴンの色を決める処理
        // ==========================================
        function getColorByHinmoku(hinmoku) {
            if (!hinmoku) return "#e0e0e0";
            let val = String(hinmoku).trim();

            const colorMap = {
                "てんたかく": "#64b5f6",
                "てんたかく:直播 鉄コ": "#42a5f5",
                "1": "#64b5f6",
                "コシヒカリ": "#8bc34a",
                "コシヒカリ:直播 V溝": "#7cb342",
                "コシヒカリ:直播 鉄コ": "#689f38",
                "コシヒカリ:アルギ": "#d1c4e9",
                "2": "#8bc34a",
                "7": "#d1c4e9",
                "富富富": "#e040fb",
                "富富": "#e040fb",
                "4": "#e040fb",
                "やまだわら": "#f8bbd0",
                "やまだわら:飼料": "#f48fb1",
                "83": "#f8bbd0",
                "砂利採取": "#9e9e9e",
                "鉄コ": "#78909c",
                "V溝": "#5c6bc0",
                "9": "#9e9e9e",
                "14": "#78909c",
                "23": "#5c6bc0",
                "畑など": "#f44336",
                "大麦・大豆": "#ffeb3b",
                "未定": "#f1f8e9"
            };

            if (colorMap[val]) return colorMap[val];
            if (val.includes("てんたかく")) return "#64b5f6";
            if (val.includes("コシヒカリ")) return "#8bc34a";
            if (val.includes("富富富")) return "#e040fb";
            if (val.includes("アルギ")) return "#d1c4e9";
            if (val.includes("やまだわら")) return "#f8bbd0";
            if (val.includes("砂利")) return "#9e9e9e";
            if (val.includes("畑")) return "#f44336";
            if (val.includes("大麦") || val.includes("大豆")) return "#ffeb3b";

            return "#b0bec5";
        }

        // ==========================================
        // 【ラベル更新】地図上のポリゴンに文字（ラベル）を表示・更新する処理
        // ==========================================
        function updateLabels() {
            labelLayerGroup.clearLayers();

            if (!document.getElementById('labelToggle').checked || !currentGeojsonObj) {
                map.removeLayer(labelLayerGroup);
                return;
            }

            const selectedKey = document.getElementById('labelFieldSelect').value;

            if (currentGeojsonObj && currentGeojsonObj.features) {
                currentGeojsonObj.features.forEach(feature => {
                    try {
                        let p = feature.properties || {};
                        let rawValue = selectedKey ? p[selectedKey] : null;

                        if (rawValue === null || rawValue === undefined || rawValue === "null" || String(rawValue).trim() === "") {
                            return;
                        }

                        let labelText = String(rawValue);
                        let tempLayer = L.geoJSON(feature);
                        let bounds = tempLayer.getBounds();
                        if (bounds && bounds.isValid()) {
                            let center = bounds.getCenter();
                            let labelIcon = L.divIcon({
                                className: 'polygon-label',
                                html: `<div style="font-size:11px; font-weight:bold; color:#000; text-shadow: 1px 1px 2px #fff, -1px -1px 2px #fff, 1px -1px 2px #fff, -1px 1px 2px #fff; white-space:nowrap; text-align:center; pointer-events:none;">${labelText}</div>`,
                                iconSize: [60, 20],
                                iconAnchor: [30, 10]
                            });
                            L.marker(center, { icon: labelIcon, interactive: false }).addTo(labelLayerGroup);
                        }
                    } catch (e) {
                        console.log("ラベル生成エラー:", e);
                    }
                });
            }

            labelLayerGroup.addTo(map);
        }

        // ==========================================
        // 【ラベル表示切替】チェックボックスの変更に応じてラベルの表示・非表示を切り替える処理
        // ==========================================
        function toggleLabels(checkbox) {
            updateLabels();
        }

        // ==========================================
        // 【追跡開始】GPSで現在地を取得し、地図の中心を移動・進行方向を向く矢印でマークする処理
        // ==========================================
        function startTracking() {
            if (!navigator.geolocation) {
                alert("この端末は位置情報取得に対応していません。");
                return;
            }
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            alert("位置情報の取得を開始します。GPSの電波状況をご確認ください。");
            startAutoLogging();

            watchId = navigator.geolocation.watchPosition(
                function (position) {
                    var lat = position.coords.latitude;
                    var lng = position.coords.longitude;
                    var heading = position.coords.heading; // 進行方向 (0〜360度)

                    window.currentLatLng = { lat: lat, lng: lng };

                    // 進行方向（heading）がある場合は矢印をその角度に回転させる
                    var rotationStyle = (heading !== null && !isNaN(heading)) ? `transform: rotate(${heading}deg);` : '';
                    var arrowIcon = L.divIcon({
                        className: 'arrow-marker',
                        html: `<div class="arrow-icon-inner" style="${rotationStyle}"></div>`,
                        iconSize: [30, 30],
                        iconAnchor: [15, 15]
                    });

                    if (!currentMarker) {
                        currentMarker = L.marker([lat, lng], { icon: arrowIcon }).addTo(map).bindPopup("現在地").openPopup();
                    } else {
                        currentMarker.setIcon(arrowIcon);
                        currentMarker.setLatLng([lat, lng]);
                    }

                    map.panTo([lat, lng]);
                },
                function (error) {
                    let errorMsg = "位置情報の取得に失敗しました。";
                    switch (error.code) {
                        case error.PERMISSION_DENIED:
                            errorMsg = "位置情報の利用が許可されていません。ブラウザの設定をご確認ください。";
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMsg = "位置情報が取得できませんでした（GPS信号の不具合など）。";
                            break;
                        case error.TIMEOUT:
                            errorMsg = "位置情報の取得がタイムアウトしました。";
                            break;
                    }
                    alert(errorMsg);
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
            );
        }

        // ==========================================
        // 【現在地Firebase保存機能】秒単位の一意なID（YYYYMMDD_HHMMSS）でFirestoreへ保存
        // ==========================================
        async function saveCurrentLocationCsv() {
            let lat = (window.currentLatLng && window.currentLatLng.lat) ? window.currentLatLng.lat : "";
            let lng = (window.currentLatLng && window.currentLatLng.lng) ? window.currentLatLng.lng : "";

            let dateVal = document.getElementById('global-date').value;
            let timeVal = document.getElementById('global-time').value;

            if (!lat || !lng) {
                alert("現在地がまだ取得できていません。「追跡開始」を押してGPSの位置情報を取得してください。");
                return;
            }
            if (!dateVal || !timeVal) {
                alert("日付と時間を正しく入力してください。");
                return;
            }

            // 秒単位まで含めた一意なカスタムIDを生成（例: 20260905_150830）
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            let cleanDate = `${year}${month}${day}`;
            let cleanTime = `${hours}${minutes}${seconds}`;
            let customDocId = `${cleanDate}_${cleanTime}`;
            let dateTimeStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

            try {
                if (!firebase.apps.length) {
                    const firebaseConfig = {
                        apiKey: "AIzaSyCCM0-1Vdu-De9eqkh1UNawQQ71dg-U",
                        authDomain: "my-map-log-5e3bd.firebaseapp.com",
                        projectId: "my-map-log-5e3bd",
                        storageBucket: "my-map-log-5e3bd.appspot.com",
                        messagingSenderId: "52246773478",
                        appId: "1:52246773478:web:dc5eb04d5e52d4922c527"
                    };
                    firebase.initializeApp(firebaseConfig);
                }
                const db = firebase.firestore();

                await db.collection("locationLogs").doc(customDocId).set({
                    latitude: lat,
                    longitude: lng,
                    date: dateVal,
                    time: timeVal,
                    dateTime: dateTimeStr,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                console.log(`[Firebase保存成功] ID: ${customDocId}, 緯度: ${lat}, 経度: ${lng}`);
                alert("現在地をFirebaseに保存しました！（ID: " + customDocId + "）");
            } catch (e) {
                alert("Firebaseへの保存に失敗しました: " + e.message);
                console.error(e);
            }
        }

        // --- 自動ジャーナル記録 ---
        let autoLoggingTimer = null;

        function startAutoLogging() {
            if (autoLoggingTimer) {
                clearInterval(autoLoggingTimer);
            }

            console.log("【自動ログ】自動稲刈りジャーナル記録を開始しました（テスト間隔: 1分）");

            autoLoggingTimer = setInterval(() => {
                checkAndLogCurrentPosition();
            }, 60 * 1000);
        }

        function stopAutoLogging() {
            if (autoLoggingTimer) {
                clearInterval(autoLoggingTimer);
                autoLoggingTimer = null;
                console.log("【自動ログ】自動稲刈りジャーナル記録を停止しました。");
            }
        }

        function checkAndLogCurrentPosition() {
            if (!window.currentLatLng) {
                console.log("【自動ログ】現在地がまだ取得できていません。");
                return;
            }

            let latLng = window.currentLatLng;
            let matchedPolygonNo = null;

            if (window.currentGeojsonObj && window.currentGeojsonObj.features) {
                window.currentGeojsonObj.features.forEach(feature => {
                    let tempLayer = L.geoJSON(feature);
                    let bounds = tempLayer.getBounds();

                    if (bounds.contains(latLng)) {
                        let p = feature.properties || {};
                        matchedPolygonNo = p["東西列No"] || p["name"] || "不明な区画";
                    }
                });
            }

            if (matchedPolygonNo) {
                let now = new Date();
                let timeString = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                let dateString = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;

                console.log(`【自動ログ記録】 日付: ${dateString}, 時間: ${timeString}, 東西列No: ${matchedPolygonNo}`);
            } else {
                console.log("【自動ログ】現在、どの圃場ポリゴンにも含まれていません（移動中など）。");
            }
        }

        // ==========================================
        // 【追跡終了】GPSによる現在地の追跡を停止する処理
        // ==========================================
        function stopTracking() {
            stopAutoLogging();
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                alert("追跡を終了しました。");
            } else {
                alert("現在、追跡は行われていません。");
            }
            if (currentMarker) {
                map.removeLayer(currentMarker);
                currentMarker = null;
            }
        }
    </script>
</body>

</html>
