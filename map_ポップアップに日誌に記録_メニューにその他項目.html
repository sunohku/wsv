<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム追跡 地理院地図 (品目色分け・確認機能)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px;
            border-radius: 6px;
            box-shadow: 0 0 8px rgba(0,0,0,0.3);
            font-size: 13px;
        }

        .control-row {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            font-size: 12px;
            font-weight: bold;
        }

        .control-group input, .control-group select {
            padding: 4px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .popup-btn {
            margin-top: 8px;
            padding: 6px 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .popup-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div id="controls">
        <div>
            <button onclick="startTracking()">追跡開始</button>
            <button onclick="stopTracking()">追跡終了</button>
            <label style="margin-left: 8px;"><input type="checkbox" id="labelToggle" checked onchange="toggleLabels(this)"> ラベル表示</label>
        </div>
        
        <!-- ▼ ご希望の入力欄とコンボボックスを追加 -->
        <div class="control-row">
            <div class="control-group">
                <span>日付</span>
                <input type="date" id="global-date">
            </div>
            <div class="control-group">
                <span>時間</span>
                <input type="time" id="global-time">
            </div>
            <div class="control-group">
                <span>作業名</span>
                <select id="global-work-select">
                    <option value="稲刈り">稲刈り</option>
                    <option value="種まき">種まき</option>
                    <option value="施肥">施肥</option>
                    <option value="農薬散布">農薬散布</option>
                    <option value="見回り">見回り</option>
                </select>
            </div>
        </div>

        <input type="file" id="fileInput" accept=".geojson,.json" style="display:none;" />
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // ページ読み込み時に日付と時間に現在の値を自動セット
        window.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            document.getElementById('global-date').value = `${year}-${month}-${day}`;
            document.getElementById('global-time').value = `${hours}:${minutes}`;
        });

        var map = L.map('map').setView([36.747, 137.016], 14);

        L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
            attribution: "地理院タイル",
            maxZoom: 18
        }).addTo(map);

        var currentMarker = null;
        var watchId = null;
        var geojsonLayer = null;
        var currentGeojsonObj = null;
        var labelLayerGroup = L.layerGroup();

        async function loadGeoJsonFromServer() {
            try {
                let response = await fetch('/品目_4326.geojson');
                if (!response.ok) throw new Error("サーバーからファイルを取得できませんでした。");
                currentGeojsonObj = await response.json();
                renderGeoJson(currentGeojsonObj);
            } catch (err) {
                console.log("自動読み込み失敗:", err);
            }
        }

        function renderGeoJson(geojson) {
            if (geojsonLayer) {
                map.removeLayer(geojsonLayer);
            }
            labelLayerGroup.clearLayers();
            window.featureMap = {};

            geojsonLayer = L.geoJSON(geojson, {
                style: function (feature) {
                    let p = feature.properties || {};
                    let hinmoku = p.品目 || p.hinmoku || "";
                    let isChecked = (p.RDflg === "確認済");
                    let baseColor = getColorByHinmoku(hinmoku);
                    return {
                        color: isChecked ? "#2c3e50" : baseColor,
                        fillColor: baseColor,
                        fillOpacity: 0.5,
                        weight: isChecked ? 3 : 1.5
                    };
                },
                onEachFeature: function (feature, layer) {
                    let layerId = L.stamp(layer);
                    window.featureMap[layerId] = { feature: feature, layer: layer };

                    try {
                        let p = feature.properties || {};
                        let hinmoku = String(p.品目 || p.hinmoku || "");
                        let labelText = (hinmoku === "1") ? "てんたかく" : "ー";
                        let bounds = layer.getBounds();
                        if (bounds && bounds.isValid()) {
                            let center = bounds.getCenter();
                            let labelIcon = L.divIcon({
                                className: 'polygon-label',
                                html: `<div style="font-size:11px; font-weight:bold; color:#000; text-shadow: 1px 1px 2px #fff, -1px -1px 2px #fff, 1px -1px 2px #fff, -1px 1px 2px #fff; white-space:nowrap; text-align:center; pointer-events:none;">${labelText}</div>`,
                                iconSize: [60, 20],
                                iconAnchor: [30, 10]
                            });
                            L.marker(center, { icon: labelIcon, interactive: false }).addTo(labelLayerGroup);
                        }
                    } catch (e) {
                        console.log("ラベル生成エラー:", e);
                    }

                    // ポップアップはスッキリシンプルに「日誌に記録」と「確認済にする」だけに
                    layer.on('click', function () {
                        let p = feature.properties || {};
                        let farmName = p.名前 || p.name || "";
                        
                        let popupContent = `
                            <b>名前：</b> ${farmName} <br>
                            <b>品目：</b> <span id="val-hinmoku">${p.品目 || p.hinmoku || ""}</span> <br>
                            <b>面積：</b> ${p.面積 || p.area || ""} ㎡ (${p.面積ａ || ""}a)<br>
                            <b>完了日：</b> <span id="val-okdate">${p.okdate || "未完了"}</span> <br>
                            <b>RDflg：</b> <span id="val-rdflg">${p.RDflg || "未確認"}</span> <br><br>
                            
                            <button class="popup-btn" style="background-color: #17a2b8;" onclick="savePopupLog('${farmName}')">日誌に記録</button>
                            <button class="popup-btn" style="background-color: #28a745; margin-left: 4px;" onclick="updateRecord('${layerId}')">確認済にする</button>
                        `;
                        layer.bindPopup(popupContent);
                    });
                }
            });

            geojsonLayer.addTo(map);
            if (document.getElementById('labelToggle').checked) {
                labelLayerGroup.addTo(map);
            }

            const bounds = geojsonLayer.getBounds();
            if (bounds.isValid()) {
                map.fitBounds(bounds);
            }
        }

        function toggleLabels(checkbox) {
            if (checkbox.checked) {
                labelLayerGroup.addTo(map);
            } else {
                map.removeLayer(labelLayerGroup);
            }
        }

        loadGeoJsonFromServer();

        function startTracking() {
            if (!navigator.geolocation) {
                alert("この端末は位置情報取得に対応していません。");
                return;
            }
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            watchId = navigator.geolocation.watchPosition(
                function (position) {
                    var lat = position.coords.latitude;
                    var lng = position.coords.longitude;
                    if (!currentMarker) {
                        currentMarker = L.marker([lat, lng]).addTo(map).bindPopup("現在地").openPopup();
                    } else {
                        currentMarker.setLatLng([lat, lng]);
                    }
                    map.setView([lat, lng], 16);
                },
                function (error) {
                    alert("位置情報の取得に失敗しました: " + error.message);
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
            );
        }

        function stopTracking() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                alert("追跡を終了しました。");
                currentMarker = null;
            }
        }

        function getColorByHinmoku(hinmoku) {
            if (!hinmoku) return "#808080";
            const colorMap = {
                "1": "#2ecc71", "2": "#f1c40f", "4": "#e67e22", "7": "#9b59b6",
                "14": "#e74c3c", "23": "#e84393", "83": "#1abc9c", "花き": "#3498db",
                "放牧地": "#d35400", "その他": "#7f8c8d"
            };
            return colorMap[hinmoku] || "#7f8c8d";
        }

        // 下部メニューで選んだ日付・時間・作業名を使ってサーバーに日誌を保存する関数
        window.savePopupLog = async function (farmName) {
            const dateVal = document.getElementById('global-date').value; // 例: 2026-08-29
            const timeVal = document.getElementById('global-time').value; // 例: 17:35
            const workName = document.getElementById('global-work-select').value; // 例: 稲刈り

            if (!dateVal || !timeVal) {
                alert("日付と時間を正しく入力してください。");
                return;
            }

            // ファイル名用の年月日時 (YYYYMMDDHHMM)
            const cleanDate = dateVal.replace(/-/g, '');
            const cleanTime = timeVal.replace(/:/g, '');
            const fileName = `${cleanDate}${cleanTime}_cptn.csv`;
            
            // CSVの中身
            let content = `時間,作業名\r\n${timeVal},${workName} (${farmName})`;

            try {
                let response = await fetch('/save-log', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fileName: fileName, content: content })
                });
                let result = await response.json();
                if (result.status === "success") {
                    alert(`【${dateVal} ${timeVal}】\n「${workName} (${farmName})」を日誌に記録・保存しました！`);
                } else {
                    alert("日誌の保存に失敗しました: " + result.message);
                }
            } catch (e) {
                alert("サーバーとの通信に失敗しました: " + e.message);
            }
        };

        window.updateRecord = async function (layerId) {
            let item = window.featureMap[layerId];
            if (!item) return;

            let p = item.feature.properties;
            let hinmoku = p.品目 || p.hinmoku || "";

            let now = new Date();
            let year = now.getFullYear();
            let month = String(now.getMonth() + 1).padStart(2, '0');
            let day = String(now.getDate()).padStart(2, '0');
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');
            let timeStr = `${year}/${month}/${day} ${hours}:${minutes}:${seconds}`;

            p.RDflg = "確認済";
            p.okdate = timeStr;

            let baseColor = getColorByHinmoku(hinmoku);
            item.layer.setStyle({ color: "#2c3e50", fillColor: baseColor, weight: 3 });

            item.layer.closePopup();
            item.layer.openPopup();

            if (currentGeojsonObj) {
                try {
                    let response = await fetch('/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(currentGeojsonObj)
                    });
                    let result = await response.json();
                    if (result.status === "success") {
                        alert("確認済みに更新し、サーバーに保存しました！");
                    } else {
                        alert("保存に失敗しました: " + result.message);
                    }
                } catch (e) {
                    alert("サーバーとの通信に失敗しました: " + e.message);
                }
            } else {
                alert("確認済みに更新しました！");
            }
        };
    </script>
</body>
</html>
