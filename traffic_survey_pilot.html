<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>交通量調査パイロットシステム</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .btn-active:active {
            transform: scale(0.96);
            transition: transform 0.05s ease;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col justify-between overflow-hidden">

    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex justify-between items-center shadow-md">
        <div>
            <h1 class="text-base font-bold text-sky-400">交通量調査ロガー</h1>
            <p class="text-xs text-slate-400">地点: 交差点セクション A-1</p>
        </div>
        <div class="flex items-center space-x-2">
            <span id="sync-status" class="inline-block w-3 h-3 rounded-full bg-emerald-500 animate-pulse" title="Firestore 接続中"></span>
            <span id="current-time" class="text-sm font-mono font-semibold text-slate-200">15:52</span>
        </div>
    </header>

    <main class="flex-1 p-3 flex flex-col justify-between max-w-md mx-auto w-full">
        <!-- Live Counters Display -->
        <div class="grid grid-cols-4 gap-2 mb-2 bg-slate-800/80 p-2 rounded-xl border border-slate-700 text-center">
            <div>
                <div class="text-[10px] text-slate-400">普通車</div>
                <div id="count-futsu" class="text-lg font-bold text-sky-300 font-mono">0</div>
            </div>
            <div>
                <div class="text-[10px] text-slate-400">大型車</div>
                <div id="count-oogata" class="text-lg font-bold text-amber-300 font-mono">0</div>
            </div>
            <div>
                <div class="text-[10px] text-slate-400">二輪車</div>
                <div id="count-nirin" class="text-lg font-bold text-emerald-300 font-mono">0</div>
            </div>
            <div>
                <div class="text-[10px] text-slate-400">歩行者</div>
                <div id="count-hokosha" class="text-lg font-bold text-rose-300 font-mono">0</div>
            </div>
        </div>

        <!-- 2x2 Giant Touch Buttons -->
        <div class="grid grid-cols-2 gap-3 flex-1 my-1">
            <!-- 普通車 Button -->
            <button onclick="recordEvent('普通車', 'futsu', '#38bdf8')" 
                class="btn-active bg-sky-600 hover:bg-sky-500 active:bg-sky-700 border-2 border-sky-400 rounded-2xl shadow-xl flex flex-col items-center justify-center p-4 text-white">
                <span class="text-3xl font-bold mb-1">🚗</span>
                <span class="text-xl font-bold tracking-wider">普通車</span>
            </button>

            <!-- 大型車 Button -->
            <button onclick="recordEvent('大型車', 'oogata', '#f59e0b')" 
                class="btn-active bg-amber-600 hover:bg-amber-500 active:bg-amber-700 border-2 border-amber-400 rounded-2xl shadow-xl flex flex-col items-center justify-center p-4 text-white">
                <span class="text-3xl font-bold mb-1">🚚</span>
                <span class="text-xl font-bold tracking-wider">大型車</span>
            </button>

            <!-- 二輪車 Button -->
            <button onclick="recordEvent('二輪車', 'nirin', '#10b981')" 
                class="btn-active bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 border-2 border-emerald-400 rounded-2xl shadow-xl flex flex-col items-center justify-center p-4 text-white">
                <span class="text-3xl font-bold mb-1">🏍️</span>
                <span class="text-xl font-bold tracking-wider">二輪車</span>
            </button>

            <!-- 歩行者 Button -->
            <button onclick="recordEvent('歩行者', 'hokosha', '#f43f5e')" 
                class="btn-active bg-rose-600 hover:bg-rose-500 active:bg-rose-700 border-2 border-rose-400 rounded-2xl shadow-xl flex flex-col items-center justify-center p-4 text-white">
                <span class="text-3xl font-bold mb-1">🚶</span>
                <span class="text-xl font-bold tracking-wider">歩行者</span>
            </button>
        </div>

        <div class="mt-2 space-y-2">
            <div class="flex space-x-2">
                <!-- Undo Button -->
                <button onclick="undoLastEvent()" id="undo-btn" disabled
                    class="flex-1 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed border border-slate-600 text-slate-200 font-semibold py-3 px-4 rounded-xl shadow transition text-sm flex items-center justify-center space-x-1">
                    <span>↩️ 直前を取り消す</span>
                </button>
                <!-- Clear / Reset -->
                <button onclick="resetSession()" 
                    class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-rose-400 font-semibold py-3 px-4 rounded-xl shadow transition text-sm">
                    リセット
                </button>
            </div>

            <!-- Recent Log Feed (Ticker) -->
            <div class="bg-slate-800/90 border border-slate-700 rounded-xl p-2.5 h-20 overflow-y-auto font-mono text-xs shadow-inner" id="log-ticker">
                <div class="text-slate-500 text-center py-2">ログはまだ記録されていません</div>
            </div>
        </div>
    </main>

    <!-- App Logic & Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "my-map-log",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        let db = null;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            console.log("[Firebase] Initialized successfully.");
        } catch (e) {
            console.error("[Firebase Error] Initialization failed: ", e);
        }

        let counts = { futsu: 0, oogata: 0, nirin: 0, hokosha: 0 };
        let historyStack = [];

        setInterval(() => {
            const now = new Date();
            const timeString = now.toTimeString().split(' ')[0].substring(0, 5);
            document.getElementById('current-time').textContent = timeString;
        }, 1000);

        // グローバルスコープに登録
        window.recordEvent = async function(categoryName, categoryKey, colorHex) {
            const now = new Date();
            const timestamp = now.toISOString();
            const timeFormatted = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0').substring(0, 2);

            counts[categoryKey]++;
            document.getElementById(`count-${categoryKey}`).textContent = counts[categoryKey];

            let docId = null;
            if (db) {
                try {
                    const docRef = await addDoc(collection(db, "traffic_logs"), {
                        categoryKey: categoryKey,
                        categoryName: categoryName,
                        timestamp: timestamp,
                        createdAt: serverTimestamp()
                    });
                    docId = docRef.id;
                    console.log(`[Firestore] Document written with ID: ${docId}`);
                } catch (e) {
                    console.error("[Firestore Error] Error adding document: ", e);
                }
            }

            historyStack.push({
                key: categoryKey,
                name: categoryName,
                time: timeFormatted,
                timestamp: timestamp,
                docId: docId
            });

            document.getElementById('undo-btn').disabled = false;

            const ticker = document.getElementById('log-ticker');
            if (historyStack.length === 1) {
                ticker.innerHTML = '';
            }

            const logItem = document.createElement('div');
            logItem.className = "flex justify-between items-center py-1 border-b border-slate-700/50";
            logItem.innerHTML = `
                <span class="font-bold" style="color: ${colorHex};">${categoryName}</span>
                <span class="text-slate-400">${timeFormatted}</span>
            `;
            ticker.prepend(logItem);
        };

        window.undoLastEvent = async function() {
            if (historyStack.length === 0) return;

            const lastEvent = historyStack.pop();
            counts[lastEvent.key]--;
            document.getElementById(`count-${lastEvent.key}`).textContent = counts[lastEvent.key];

            if (lastEvent.docId && db) {
                try {
                    await deleteDoc(doc(db, "traffic_logs", lastEvent.docId));
                    console.log(`[Firestore] Deleted document with ID: ${lastEvent.docId}`);
                } catch (e) {
                    console.error("[Firestore Error] Error deleting document: ", e);
                }
            }

            const ticker = document.getElementById('log-ticker');
            if (ticker.firstChild) {
                ticker.removeChild(ticker.firstChild);
            }
            if (historyStack.length === 0) {
                ticker.innerHTML = '<div class="text-slate-500 text-center py-2">ログはまだ記録されていません</div>';
                document.getElementById('undo-btn').disabled = true;
            }
        };

        window.resetSession = function() {
            if (historyStack.length > 0 && !confirm('すべてのカウントをリセットしますか？')) {
                return;
            }
            counts = { futsu: 0, oogata: 0, nirin: 0, hokosha: 0 };
            historyStack = [];
            document.getElementById('count-futsu').textContent = '0';
            document.getElementById('count-oogata').textContent = '0';
            document.getElementById('count-nirin').textContent = '0';
            document.getElementById('count-hokosha').textContent = '0';
            document.getElementById('log-ticker').innerHTML = '<div class="text-slate-500 text-center py-2">ログはまだ記録されていません</div>';
            document.getElementById('undo-btn').disabled = true;
        };
    </script>
</body>
</html>
