<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>圃場マップ（基本表示・修正版）</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. 地図の初期化
        const map = L.map('map').setView([36.746, 137.016], 14);

        // 2. 地理院タイル（空中写真）の追加
        L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{y}/{x}.jpg', {
            maxZoom: 18,
            attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル（空中写真）</a>'
        }).addTo(map);

        // 3. 品種・品目に応じた色分け設定の関数
        function getFeatureColor(code) {
            // 文字列や数値の違いを吸収するため String に変換して判定
            switch (String(code)) {
                case '1': return '#ff4136'; // 赤系
                case '2': return '#2ecc40'; // 緑系
                case '3': return '#0074D9'; // 青系
                case '4': return '#B10DC9'; // 紫系
                case '5': return '#FFDC00'; // 黄系
                default:  return '#FF851B'; // その他・未定義
            }
        }

        // 4. GeoJSONデータの読み込みと描画
        fetch('品目5_4326.geojson')
            .then(response => response.json())
            .then(data => {
                // デバッグ用：最初のデータのプロパティをコンソールに表示して確認できます
                if (data.features && data.features.length > 0) {
                    console.log("GeoJSONのプロパティ確認:", data.features[0].properties);
                }

                const geoJsonLayer = L.geoJson(data, {
                    style: function(feature) {
                        p = feature.properties;
                        
                        // ★お使いのGeoJSONの実際のプロパティ名に合わせてここを変更してください
                        // 例: p.item_code, p.品目コード, p.variety など
                        const code = p.item_code !== undefined ? p.item_code : (p.品目コード !== undefined ? p.品目コード : 0);
                        
                        const fillColor = getFeatureColor(code);

                        return {
                            color: '#ffffff',       // 枠線の色（白）
                            weight: 2,              // 枠線の太さ
                            fillColor: fillColor,   // 塗りつぶしの色
                            fillOpacity: 0.6        // 塗りつぶしの不透明度
                        };
                    },
                    onEachFeature: function(feature, layer) {
                        let popupContent = "<b>圃場情報</b><br>";
                        if (feature.properties) {
                            for (let key in feature.properties) {
                                popupContent += `${key}: ${feature.properties[key]}<br>`;
                            }
                        }
                        layer.bindPopup(popupContent);
                    }
                }).addTo(map);

                if (geoJsonLayer.getBounds().isValid()) {
                    map.fitBounds(geoJsonLayer.getBounds());
                }
            })
            .catch(error => {
                console.error('GeoJSONの読み込みに失敗しました:', error);
                alert('GeoJSONファイルの読み込みに失敗しました。');
            });
    </script>
</body>
</html>
